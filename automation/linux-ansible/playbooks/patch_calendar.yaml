# Ansible Linux patch calendar — source of truth for the scheduler
# Times are America/Los_Angeles (PST/PDT).
# week: first  = first week of month (days 1–7 style weekday match)
#        last  = last week of month (final occurrence of that weekday)
# weekday: mon,tue,wed,thu,fri,sat,sun
# patch_time: 24h HH:MM start of window (when patch_and_verify.yml runs)
# enabled: false = schedule/notify only skipped until confirmed
# inventory_group must match /etc/ansible/hosts (or hosts.ini for Aspera)

timezone: America/Los_Angeles

# =============================================================================
# OPERATING MODE
# =============================================================================
# testing: true  => ONLY allow_job_ids below may notify or patch.
#                   All other calendar jobs are materialized as enabled=no.
# testing: false => Full production scheduler (set only when explicitly approved).
# WE ARE IN TESTING MODE UNTIL THE OWNER SAYS OTHERWISE.
mode:
  testing: true
  allow_job_ids:
    - ebstest_process_test
  # If true, even allowed jobs only send email — never run patch_and_verify.yml
  notify_only: false

# Zabbix maintenance (pre-patch)
zabbix:
  enabled: true
  api_host: smczabbixp01p.example.customer.local
  user: operator
  # password in scripts/zabbix_api.env (not in git)
  minutes_before: 10
  duration_minutes: 360  # safety ceiling; removed 10m after patch ends
  collect_data: true


inventory: /etc/ansible/hosts
# Extra inventory for groups not in main hosts file (Aspera)
extra_inventories:
  - /etc/ansible/hosts.ini

mail:
  smtp_host: mail.jackinthebox.com
  smtp_port: 25
  from: ansible@example.customer.local
  # Always CC operations on every notice (optional)
  always_cc: []

# Shared contact aliases (expand in recipients lists)
