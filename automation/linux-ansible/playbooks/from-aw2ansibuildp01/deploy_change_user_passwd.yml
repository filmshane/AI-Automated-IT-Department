# For AutomationAI customer product use — review before production.
# Original employer-specific hosts/domains/secrets stripped or vaulted.

---
- name: Deploy and run password change script
  hosts: all
  become: yes
  become_user: root
  gather_facts: no

  vars:
    # Pass users via command line, e.g.:
    # -e 'target_users=["ansible_admin"]'
    # -e 'target_users=["user1","user2","user3"]'
    target_users: []

  tasks:
    - name: Validate that 1-3 users were provided
      ansible.builtin.assert:
        that:
          - target_users | length >= 1
          - target_users | length <= 3
        fail_msg: "ERROR: You must provide between 1 and 3 users using -e 'target_users=[\"user1\",\"user2\"]'"

    - name: Copy the password change script to the host
      ansible.builtin.copy:
        src: /etc/ansible/playbook/change_user_passwd.sh
        dest: /usr/local/bin/change_user_passwd.sh
        owner: root
        group: root
        mode: '0755'

    - name: Run the password change script as root
      ansible.builtin.command:
        cmd: "/usr/local/bin/change_user_passwd.sh {{ target_users | join(' ') }}"
      register: script_result
      changed_when: true

    - name: Show script output
      ansible.builtin.debug:
        var: script_result.stdout_lines
