# Original employer-specific hosts/domains/secrets stripped or vaulted.

---
- name: Add user on RedHat/Debian servers
  hosts: all
  become: yes
  vars:  
    user_group: "users"
    user_shell: "/bin/bash"
  
  vars_prompt:
    - name: username
      prompt: "Enter the username to create"
      private: no
    - name: password
      prompt: "Enter the password for the user"
      private: yes
    - name: user_comment
      prompt: "Enter the comment for the user"
      private: no

  tasks:
    - name: Ensure Users group exists
      ansible.builtin.group:
        name: "{{ user_group }}"
        state: present

    - name: Detect admin group based on OS family
      set_fact:
        admin_group: "{{ 'wheel' if ansible_facts['os_family'] == 'RedHat' else 'sudo' }}"

    - name: Create user with details
      ansible.builtin.user:
        name: "{{ username }}"
        group: "{{ user_group }}"
        shell: "{{ user_shell }}"
        comment: "{{ user_comment }}"
        create_home: yes
        groups: "{{ admin_group }}"
        password: "{{ vault_password | mandatory }}"
        append: yes
        state: present
      register: user_result

    - name: Force password change on first login
      ansible.builtin.command: "chage -d 0 {{ username }}"
          # Only run this if the user was just created
      when: user_result.changed
    
    - name: Show user creation status
      ansible.builtin.debug:
        msg: >
          User '{{ username }}' {{ 'was created' if user_result.changed else 'already existed' }}
          and is part of '{{ user_group }}' + '{{ admin_group }}' groups.

