---
- name: Check user password expiration
  hosts: all
  become: true  # Requires elevated privileges to run chage
 
  vars_prompt:
    - name: target_user
      prompt: "Enter the username details to search"
      private: no

  tasks:
    - name: Run chage -l command to get expiration info
      ansible.builtin.command: "chage -l {{ target_user }}"
      register: chage_output
      changed_when: false # This task is for gathering info, not making changes

    - name: Display password expiration information
      ansible.builtin.debug:
        var: chage_output.stdout_lines

        #msg: "{{ item | regex_replace('[\\t ]*:[\\t ]*', ' :  ') }}"
        #loop: "{{ chage_output.stdout_lines }}"

    - name: Set a fact for when the password expires
      ansible.builtin.set_fact:
        password_expires_line: "{{ chage_output.stdout_lines | select('search', 'Password expires') | first | default('') | regex_replace('\\s*:\\s*', ' :  ') }}"

    - name: Display the password expiration line
      ansible.builtin.debug:
        msg: "The password expiration line for {{ target_user }} is: {{ password_expires_line }}"

