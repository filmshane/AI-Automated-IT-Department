# Original employer-specific hosts/domains/secrets stripped or vaulted.

---
# Start PROD Timekeeping (WBPA1-4, WBPW1-2)
# WebSphere app servers: sequential startServer.sh (NOT IE GUI)
#
#   ansible-playbook -i inventory_timekeeping.ini start_timekeeping.yml

- name: START plan
  hosts: localhost
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  tasks:
    - ansible.builtin.debug:
        msg: |
          START order:
            1) startManager WBPA1
            2) startNode WBPA1, startNode WBPA2
            3) startServer each app server (replaces WAS GUI Start)
                 WBPA1: {{ was_start_order_wbpa1 | join(', ') }}
                 WBPA2: {{ was_start_order_wbpa2 | join(', ') }}
            4) Cognos crnctl start WBPA4
            5) wbmail WBPA1
            6) scheduler WBPA3
            7) siteup WBPW1/WBPW2

##############################################################################
# 1. startManager
##############################################################################
- name: "1) startManager (WBPA1)"
  hosts: tk_wbpa1
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: startManager.sh
      ansible.builtin.shell: |
        set -e
        sudo -u {{ wasadmin_user }} {{ was_dmgr_bin }}/startManager.sh
      args:
        executable: /bin/bash
      register: start_mgr

    - ansible.builtin.debug:
        var: start_mgr.stdout_lines

##############################################################################
# 2. startNode
##############################################################################
- name: "2a) startNode WBPA1"
  hosts: tk_wbpa1
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: startNode.sh Custom01
      ansible.builtin.shell: |
        set -e
        sudo -u {{ wasadmin_user }} {{ was_node_wbpa1_bin }}/startNode.sh
      args:
        executable: /bin/bash
      register: start_node1

    - ansible.builtin.debug:
        var: start_node1.stdout_lines

- name: "2b) startNode WBPA2"
  hosts: tk_wbpa2
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: startNode.sh wbprd21 profile
      ansible.builtin.shell: |
        set -e
        sudo -u {{ wasadmin_user }} {{ was_node_wbpa2_bin }}/startNode.sh
      args:
        executable: /bin/bash
      register: start_node2

    - ansible.builtin.debug:
        var: start_node2.stdout_lines

##############################################################################
# 3. startServer.sh ONE AT A TIME (replaces WAS GUI Start)
##############################################################################
- name: "3a) startServer each app server on WBPA1"
  hosts: tk_wbpa1
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: "startServer {{ item }} (wait for success before next)"
      ansible.builtin.shell: |
        set -e
        BIN="{{ was_node_wbpa1_bin }}"
        echo "===== Starting {{ item }} on $(hostname) ====="
        # Profile wrapper invokes /app/WebSphere61/bin/startServer.sh with correct profile
        sudo -u {{ wasadmin_user }} "$BIN/startServer.sh" "{{ item }}"
        echo "===== startServer {{ item }} OK ====="
      args:
        executable: /bin/bash
      loop: "{{ was_start_order_wbpa1 }}"
      loop_control:
        label: "{{ item }}"
      register: start_srv_wbpa1

    - name: Show start results WBPA1
      ansible.builtin.debug:
        msg: "{{ item.item }} => rc={{ item.rc }}"
      loop: "{{ start_srv_wbpa1.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: serverStatus WBPA1
      ansible.builtin.shell: |
        sudo -u {{ wasadmin_user }} {{ was_node_wbpa1_bin }}/serverStatus.sh -all \
          -username {{ wasadmin_user }} -password '{{ wasadmin_password }}' || true
      register: status1
      changed_when: false

    - ansible.builtin.debug:
        var: status1.stdout_lines

- name: "3b) startServer each app server on WBPA2"
  hosts: tk_wbpa2
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: "startServer {{ item }} (wait for success before next)"
      ansible.builtin.shell: |
        set -e
        BIN="{{ was_node_wbpa2_bin }}"
        echo "===== Starting {{ item }} on $(hostname) ====="
        sudo -u {{ wasadmin_user }} "$BIN/startServer.sh" "{{ item }}"
        echo "===== startServer {{ item }} OK ====="
      args:
        executable: /bin/bash
      loop: "{{ was_start_order_wbpa2 }}"
      loop_control:
        label: "{{ item }}"
      register: start_srv_wbpa2

    - name: Show start results WBPA2
      ansible.builtin.debug:
        msg: "{{ item.item }} => rc={{ item.rc }}"
      loop: "{{ start_srv_wbpa2.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: serverStatus WBPA2
      ansible.builtin.shell: |
        sudo -u {{ wasadmin_user }} {{ was_node_wbpa2_bin }}/serverStatus.sh -all \
          -username {{ wasadmin_user }} -password '{{ wasadmin_password }}' || true
      register: status2
      changed_when: false

    - ansible.builtin.debug:
        var: status2.stdout_lines

##############################################################################
# 3c. Operator verifies STARTED in WAS console (yes/no) — retry if no
##############################################################################
- name: "3c) Operator verify Application Servers STARTED in console"
  hosts: localhost
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  vars:
    verify_max_rounds: 5
    was_start_verified: false
  tasks:
    - name: Interactive verify / re-start until operator says yes
      ansible.builtin.include_tasks: tasks/was_console_verify_start.yml
      loop: "{{ range(0, verify_max_rounds) | list }}"
      loop_control:
        loop_var: verify_round
      when: not (was_start_verified | default(false) | bool)

    - name: Require operator confirmation before continuing
      ansible.builtin.assert:
        that:
          - was_start_verified | default(false) | bool
        fail_msg: >-
          Operator did not confirm all WAS application servers are STARTED
          after {{ verify_max_rounds }} rounds. Aborting remaining start steps.
        success_msg: "Operator confirmed all Application Servers are STARTED — continuing."

##############################################################################
# 4. Cognos start — crnctl
##############################################################################
- name: "4) Cognos start via crnctl (WBPA4)"
  hosts: tk_wbpa4
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: crnctl.sh start as cognos
      ansible.builtin.shell: |
        sudo -u {{ cognos_user }} {{ cognos_crnctl }} start
      register: cognos_start
      failed_when: false

    - ansible.builtin.debug:
        msg:
          - "rc={{ cognos_start.rc }}"
          - "{{ cognos_start.stdout_lines | default([]) }}"

    - name: crnctl isRunning
      ansible.builtin.shell: |
        sudo -u {{ cognos_user }} {{ cognos_crnctl }} isRunning
      register: cognos_run
      failed_when: false
      changed_when: false

    - ansible.builtin.debug:
        var: cognos_run.stdout_lines

##############################################################################
# 5. wbmail
##############################################################################
- name: "5) Start wbmail (WBPA1)"
  hosts: tk_wbpa1
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: wbmail.sh as wbrain
      ansible.builtin.shell: |
        sudo -u {{ wbrain_user }} sh -c '
          nohup {{ wbmail_script }} >/tmp/wbmail_start.log 2>&1 &
          sleep 2
          ps -ef | grep -i wbmail | grep -v grep || true
        '
      args:
        executable: /bin/bash
      register: wbmail_start

    - ansible.builtin.debug:
        var: wbmail_start.stdout_lines

##############################################################################
# 6. Scheduler
##############################################################################
- name: "6) Start scheduler (WBPA3)"
  hosts: tk_wbpa3
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: startScheduler.sh
      ansible.builtin.shell: |
        sudo -u {{ wbrain_user }} sh -c 'cd {{ sched_dir }} && ./startScheduler.sh'
      register: sched_start

    - name: schedResumeMostJobs.sh
      ansible.builtin.shell: |
        sudo -u {{ wbrain_user }} sh -c 'cd {{ sched_dir }} && ./schedResumeMostJobs.sh'
      register: sched_resume

    - ansible.builtin.debug:
        msg:
          - "start: {{ sched_start.stdout_lines }}"
          - "resume: {{ sched_resume.stdout_lines }}"

##############################################################################
# 7. siteup
##############################################################################
- name: "7) siteup (WBPW1, WBPW2)"
  hosts: tk_web
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: siteup.sh as root
      ansible.builtin.command: sudo /usr/local/bin/siteup.sh
      register: siteup
      changed_when: true

    - ansible.builtin.debug:
        var: siteup.stdout_lines

- name: START complete
  hosts: localhost
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  tasks:
    - ansible.builtin.debug:
        msg: |
          Timekeeping START finished.
          WAS GUI was NOT used — startServer.sh ran per wbprd* server sequentially.
          Verify: {{ timekeeping_url }}
          App checks: {{ was_app_check_urls | join(', ') }}
