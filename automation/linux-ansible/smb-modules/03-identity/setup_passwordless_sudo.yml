# Original employer-specific hosts/domains/secrets stripped or vaulted.

---
- name: Configure passwordless sudo for Ansible user
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    sudo_user: "{{ ansible_user | default('ansible') }}"

  tasks:
    - name: Check current sudo privileges
      ansible.builtin.shell: |
        sudo -l -U {{ sudo_user }} 2>/dev/null || sudo -l 2>/dev/null || true
      register: sudo_list
      changed_when: false
      failed_when: false

    - name: Detect if NOPASSWD already exists
      ansible.builtin.set_fact:
        nopasswd_already_set: "{{ 'NOPASSWD: ALL' in sudo_list.stdout }}"

    - name: Show sudo status
      ansible.builtin.debug:
        msg: "User '{{ sudo_user }}' on {{ inventory_hostname }} → NOPASSWD set: {{ nopasswd_already_set }}"

    - name: Clean duplicate entries for user
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        regexp: '^{{ sudo_user }}'
        state: absent
        validate: /usr/sbin/visudo -cf %s
      loop:
        - /etc/sudoers
        - /etc/sudoers.d/ansible
        - /etc/sudoers.d/{{ sudo_user }}
      when: not nopasswd_already_set | bool
      ignore_errors: true

    - name: Check for community.general collection
      ansible.builtin.command: ansible-galaxy collection list community.general
      register: collection_check
      failed_when: false
      changed_when: false
      when: not nopasswd_already_set | bool

    - name: Install collection if needed
      ansible.builtin.command: ansible-galaxy collection install community.general
      delegate_to: localhost
      run_once: true
      when:
        - not nopasswd_already_set | bool
        - collection_check.rc != 0

    - name: Add passwordless sudo rule
      community.general.sudoers:
        name: "{{ sudo_user }}_passwordless"
        state: present
        user: "{{ sudo_user }}"
        commands: ALL
        nopasswd: true
        validate: /usr/sbin/visudo -cf %s
      when: not nopasswd_already_set | bool

    - name: Verify final sudo configuration
      ansible.builtin.shell: |
        sudo -l -U {{ sudo_user }} 2>/dev/null || sudo -l 2>/dev/null || true
      register: final_check
      changed_when: false
      failed_when: false

    - name: Report result
      ansible.builtin.debug:
        msg: >-
          {{ 'Passwordless sudo WORKING' if 'NOPASSWD: ALL' in final_check.stdout else 'Passwordless sudo NOT configured' }}
